schemaVersion: '2.2'
description: Deploy one immutable perp-dashboard commit through the audited host wrapper
parameters:
  CommitSha:
    type: String
    description: Full immutable Git commit SHA
    allowedPattern: "^[0-9a-f]{40}$"
mainSteps:
  - action: aws:runShellScript
    name: deploy
    inputs:
      timeoutSeconds: '900'
      runCommand:
        - '/usr/local/sbin/perp-dashboard-deploy "{{ CommitSha }}"'
