name: Deploy production

on:
  push:
    branches: [master]

concurrency:
  group: perp-dashboard-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '18'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:deployment

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::890742583014:role/GitHubActionsPerpDashboardDeployRole
          aws-region: ap-northeast-1
      - name: Deploy the checked-out commit through SSM
        shell: bash
        run: |
          set -Eeuo pipefail
          for sensitive_var in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN; do
            sensitive_value="${!sensitive_var:-}"
            [[ -z "$sensitive_value" ]] || printf '::add-mask::%s\n' "$sensitive_value"
          done
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          parameters="$(jq -cn --arg sha "$GITHUB_SHA" '{CommitSha:[$sha]}')"
          command_id="$(aws ssm send-command \
            --document-name PerpDashboardDeploy \
            --instance-ids i-0d3456ec595259c39 \
            --parameters "$parameters" \
            --timeout-seconds 900 \
            --query 'Command.CommandId' --output text)"
          for attempt in {1..90}; do
            invocation="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id i-0d3456ec595259c39 --output json)"
            status="$(jq -r .Status <<<"$invocation")"
            case "$status" in
              Success) jq -r '.StandardOutputContent,.StandardErrorContent' <<<"$invocation"; exit 0 ;;
              Failed|Cancelled|TimedOut|Undeliverable|Terminated) jq -r '.StandardOutputContent,.StandardErrorContent' <<<"$invocation"; exit 1 ;;
            esac
            sleep 10
          done
          aws ssm cancel-command --command-id "$command_id" --instance-ids i-0d3456ec595259c39
          exit 1
