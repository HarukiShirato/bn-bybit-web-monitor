name: Deploy production

on:
  push:
    branches:
      - master

permissions:
  contents: read
  id-token: write

concurrency:
  group: perp-dashboard-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run test:deployment

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::890742583014:role/GitHubActionsPerpDashboardDeployRole
          aws-region: ap-northeast-1

      - name: Deploy the checked-out commit through SSM
        shell: bash
        run: |
          set -Eeuo pipefail

          readonly INSTANCE_ID='i-0d3456ec595259c39'
          readonly AWS_REGION='ap-northeast-1'
          readonly COMMAND_TIMEOUT_SECONDS=900
          readonly POLL_INTERVAL_SECONDS=10
          readonly POLL_MAX_ATTEMPTS=90
          command_id=''
          completed=0
          terminal=0
          invocation=''
          status='Unknown'

          for sensitive_var in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN; do
            sensitive_value="${!sensitive_var:-}"
            [[ -z "$sensitive_value" ]] || printf '::add-mask::%s\n' "$sensitive_value"
          done

          get_invocation() {
            aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query '{Status:Status,StandardOutputContent:StandardOutputContent,StandardErrorContent:StandardErrorContent}' \
              --output json
          }

          print_invocation_logs() {
            printf '%s\n' "SSM command $command_id stdout for SHA $GITHUB_SHA:"
            jq -r '.StandardOutputContent // ""' <<<"$invocation"
            printf '%s\n' "SSM command $command_id stderr for SHA $GITHUB_SHA:" >&2
            jq -r '.StandardErrorContent // ""' <<<"$invocation" >&2
          }

          await_terminal_status() {
            local attempt
            for ((attempt = 1; attempt <= POLL_MAX_ATTEMPTS; attempt += 1)); do
              if invocation="$(get_invocation)"; then
                status="$(jq -r '.Status // "Unknown"' <<<"$invocation")"
                printf 'SSM command %s for SHA %s status: %s\n' "$command_id" "$GITHUB_SHA" "$status"
                case "$status" in
                  Success|Cancelled|TimedOut|Failed)
                    terminal=1
                    return 0
                    ;;
                esac
              else
                printf 'SSM command %s is not visible yet (poll %d/%d).\n' \
                  "$command_id" "$attempt" "$POLL_MAX_ATTEMPTS" >&2
              fi
              (( attempt == POLL_MAX_ATTEMPTS )) || sleep "$POLL_INTERVAL_SECONDS"
            done
            return 1
          }

          cancel_and_wait() {
            printf 'Cancelling SSM command %s for SHA %s.\n' "$command_id" "$GITHUB_SHA" >&2
            aws ssm cancel-command \
              --region "$AWS_REGION" \
              --command-id "$command_id" \
              --instance-ids "$INSTANCE_ID" || true
            if await_terminal_status; then
              print_invocation_logs
            else
              printf 'SSM command %s did not reach a terminal state after cancellation.\n' "$command_id" >&2
            fi
          }

          cleanup() {
            local exit_code=$?
            trap - EXIT INT TERM
            if [[ -n "$command_id" && "$completed" -eq 0 && "$terminal" -eq 0 ]]; then
              cancel_and_wait
            fi
            exit "$exit_code"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'GitHub did not provide a 40-character commit SHA' >&2
            exit 64
          }

          script_url="https://raw.githubusercontent.com/HarukiShirato/real-time-monitoring-for-perpetual-contracts/${GITHUB_SHA}/scripts/deploy-production.sh"
          remote_command="$({
            jq -nr --arg sha "$GITHUB_SHA" --arg script_url "$script_url" '
              [
                "set -Eeuo pipefail",
                "install -d -m 0755 -o ec2-user -g ec2-user /home/ec2-user/apps/perp-dashboard/shared/bin",
                (
                  "sudo -u ec2-user -H -- bash -c " +
                  (
                    "set -Eeuo pipefail\n" +
                    "sha=\"$1\"\n" +
                    "script_url=\"$2\"\n" +
                    "target=\"/home/ec2-user/apps/perp-dashboard/shared/bin/deploy-production-\($sha).sh\"\n" +
                    "curl --fail --silent --show-error --location \"$script_url\" --output \"$target\"\n" +
                    "chmod 0755 \"$target\"\n" +
                    "exec \"$target\" \"$sha\""
                    | @sh
                  ) +
                  " deploy-production " + ($sha | @sh) + " " + ($script_url | @sh)
                )
              ] | join("\n")
            '
          })"
          parameters="$(jq -cn --arg command "$remote_command" '{commands: [$command]}')"

          command_id="$(
            aws ssm send-command \
              --region "$AWS_REGION" \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --parameters "$parameters" \
              --timeout-seconds "$COMMAND_TIMEOUT_SECONDS" \
              --query 'Command.CommandId' \
              --output text
          )"
          printf 'SSM command %s submitted for SHA %s.\n' "$command_id" "$GITHUB_SHA"

          if ! await_terminal_status; then
            printf 'SSM command %s timed out after %d seconds.\n' \
              "$command_id" "$COMMAND_TIMEOUT_SECONDS" >&2
            exit 1
          fi
          print_invocation_logs
          [[ "$status" == 'Success' ]] || exit 1
          completed=1
          printf 'SSM deployment succeeded for SHA %s (command %s).\n' "$GITHUB_SHA" "$command_id"
