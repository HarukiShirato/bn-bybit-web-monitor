name: Deploy production

on:
  push:
    branches: [master]

concurrency:
  group: perp-dashboard-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '18'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:deployment

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::890742583014:role/GitHubActionsPerpDashboardDeployRole
          aws-region: ap-northeast-1
      - name: Deploy the checked-out commit through SSM
        shell: bash
        run: |
          set -Eeuo pipefail
          for sensitive_var in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN; do
            sensitive_value="${!sensitive_var:-}"
            [[ -z "$sensitive_value" ]] || printf '::add-mask::%s\n' "$sensitive_value"
          done
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          script_url="https://raw.githubusercontent.com/HarukiShirato/real-time-monitoring-for-perpetual-contracts/${GITHUB_SHA}/scripts/deploy-production.sh"
          remote_command="$(jq -nr --arg sha "$GITHUB_SHA" --arg script_url "$script_url" '
            [
              "set -Eeuo pipefail",
              "install -d -m 0755 -o ec2-user -g ec2-user /home/ec2-user/apps/perp-dashboard/shared/bin",
              ("sudo -u ec2-user -H -- bash -c " +
                ("set -Eeuo pipefail\\nsha=\\\"$1\\\"\\nscript_url=\\\"$2\\\"\\ntarget=\\\"/home/ec2-user/apps/perp-dashboard/shared/bin/deploy-production-\\($sha).sh\\\"\\ncurl --fail --silent --show-error --location \\\"$script_url\\\" --output \\\"$target\\\"\\nchmod 0755 \\\"$target\\\"\\nexec \\\"$target\\\" \\\"$sha\\\"" | @sh) +
                " deploy-production " + ($sha | @sh) + " " + ($script_url | @sh))
            ] | join("\\n")')"
          bash scripts/run-ssm-deployment.sh "$GITHUB_SHA" "$remote_command"
